name: CI

on:
  push:
    branches:
      - develop
  pull_request:
    branches:
      - develop

jobs:
  checkout:
    runs-on: ubuntu-latest
    outputs:
      repo-cache-key: repo-${{ github.sha }}
    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0 # Ensures we get commit history for diffing

      - name: 🔄 Cache repository
        uses: actions/cache@v6
        with:
          path: . # Cache the entire repo
          key: repo-${{ github.sha }}

  changes:
    needs: checkout
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
    outputs:
      python: ${{ steps.filter.outputs.python }}
      python_files: ${{ steps.filter.outputs.python_files }}
      deps: ${{ steps.filter.outputs.deps }}
    steps:
      - name: 🔄 Restore repository from cache
        uses: actions/cache@v6
        with:
          path: .
          key: repo-${{ github.sha }}

      - name: 🔍 Detect changed paths
        uses: dorny/paths-filter@v4.0.3
        id: filter
        with:
          list-files: shell
          filters: |
            python:
              - '**/*.py'
              - '**/*.pyi'
            deps:
              - 'uv.lock'
              - 'pyproject.toml'
              - '.python-version'
              - '.github/workflows/**'

  ruff-linter:
    needs: changes
    runs-on: ubuntu-latest
    if: ${{ needs.changes.outputs.python == 'true' || needs.changes.outputs.deps == 'true' }}
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: 🔄 Restore repository from cache
        uses: actions/cache@v6
        with:
          path: .
          key: repo-${{ github.sha }}

      - uses: astral-sh/ruff-action@v4.1.0
        name: ✨ Lint with Ruff
        with:
          version: "latest"
          src: ${{ needs.changes.outputs.python_files || '.' }}

  ruff-format:
    needs: changes
    runs-on: ubuntu-latest
    if: ${{ needs.changes.outputs.python == 'true' || needs.changes.outputs.deps == 'true' }}
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: 🔄 Restore repository from cache
        uses: actions/cache@v6
        with:
          path: .
          key: repo-${{ github.sha }}

      - uses: astral-sh/ruff-action@v4.1.0
        name: 📝 Format with Ruff
        with:
          version: "latest"
          src: ${{ needs.changes.outputs.python_files || '.' }}
          args: "format --diff"

  # pylint:
  #   needs: changes
  #   runs-on: ubuntu-latest
  #   if: ${{ needs.changes.outputs.python == 'true' }}
  #   permissions:
  #     contents: read
  #     pull-requests: write
  #   steps:
  #     - name: 🔄 Restore repository from cache
  #       uses: actions/cache@v6
  #       with:
  #         path: .
  #         key: repo-${{ github.sha }}

  #     - name: 🛠️ Install the latest version of uv and set the python version
  #       uses: astral-sh/setup-uv@v7
  #       with:
  #         enable-cache: true
  #         cache-dependency-glob: "uv.lock"

  #     - name: 🦾 Install the project
  #       run: uv sync --all-extras

  #     - name: 🦾 Install pylint
  #       run: uv pip install pylint

  #     - name: 🔍 Run Pylint
  #       run: uv run pylint ${{ needs.changes.outputs.python_files }}

  sonarqube:
    needs:
      - checkout # Needs full repo
      - changes
      - ruff-linter
      - ruff-format
      # - pylint
    runs-on: ubuntu-latest
    if: ${{ needs.changes.outputs.python == 'true' || needs.changes.outputs.deps == 'true' }}
    steps:
      - name: 🔄 Restore repository from cache
        uses: actions/cache@v6
        with:
          path: .
          key: repo-${{ github.sha }}

      - name: 📥 Install ffmpeg
        uses: AnimMouse/setup-ffmpeg@v1

      - name: 🛠️ Install the latest version of uv and set the python version
        uses: astral-sh/setup-uv@v10.3.3
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: 🦾 Install the project
        run: uv sync

      - name: 🧪 Run pytest with coverage
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: uv run pytest --cov-report=xml

    #   - name: 🔎 SonarQube Cloud Scan (Full Repo)
    #     uses: SonarSource/sonarqube-scan-action@master
    #     env:
    #       GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    #       SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

      - name: 🧹 Minimize uv cache
        run: uv cache prune --ci
